name: My First Workflow

on: 
  push:
  workflow_dispatch:

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Print a greeting
        run: echo "Hello from the robot!"
      - name: Get my code onto this machine
        uses: actions/checkout@v4
      - name: Now I can see my files
        run: ls -la
      - name: Try to print the secret
        run: echo "My key is $API_KEY"
        env:
          API_KEY: ${{ secrets.MY_API_KEY }}
      - name: Look around
        run: |
          pwd
          ls -la
          env



